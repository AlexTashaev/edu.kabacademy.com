<p>Используя метод духовного развития, предлагаемый каббалой, мы сможем расширить и переосмыслить отношения с окружающими.</p>
<p>Четырнадцать недель позади, и вопрос уже назрел: <strong>и что, собственно, меняется?</strong> Он законный, и ответ на него должен быть точным. Поэтому сначала — что не меняется.</p>
